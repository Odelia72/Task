const RotateCw = __makeIcon(`<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>`);
const Link2 = __makeIcon(`<path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/>`);

// ============================================
// CONSTANTS
// ============================================

const COLORS = {
  bg: '#FAFAF7',
  card: '#FFFFFF',
  border: '#EFEEEA',
  borderSoft: '#F5F4F0',
  ink: '#1F1E1B',
  inkSoft: '#5A5853',
  inkLight: '#9C9A93',
  inkVeryLight: '#C4C2BC',

  moment: '#B89968',
  momentTint: '#FAF1E0',

  cnf: '#DC2626',
  h: '#EA580C',
  m: '#EAB308',
  o: '#9CA3AF',
};

const FONT = `"Assistant", "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;

const CATEGORY_PALETTE = [
  { color: '#8B5A3C', tint: '#F5EBE3' },
  { color: '#5A8B6F', tint: '#E8F0EA' },
  { color: '#5A6F8B', tint: '#E8ECEF' },
  { color: '#A86B5A', tint: '#F5E5E0' },
  { color: '#7B5A8B', tint: '#EFE5F0' },
  { color: '#5A8B85', tint: '#E5EDEC' },
  { color: '#7B7140', tint: '#EFEDE0' },
  { color: '#8B6B5A', tint: '#F0E8E3' },
  { color: '#6B7B5A', tint: '#EAEEE3' },
  { color: '#8B5A6F', tint: '#F0E3E8' },
];

const KNOWN_CATEGORY_COLORS = {
  'מים': { color: '#5A8B85', tint: '#E5EDEC' },
  'אומנות': { color: '#8B5A3C', tint: '#F5EBE3' },
  'בריאות': { color: '#5A8B6F', tint: '#E8F0EA' },
  'בירוקרטיה': { color: '#5A6F8B', tint: '#E8ECEF' },
};

const URGENCY_ORDER = ['cnf', 'h', 'm', 'o'];
const URGENCY_LABELS = { cnf: 'CNF', h: 'H', m: 'M', o: 'O' };
const URGENCY_COLORS = { cnf: COLORS.cnf, h: COLORS.h, m: COLORS.m, o: COLORS.o };

const WATER_GOAL = 8;

const LEGACY_AREAS = {
  art: { name: 'אומנות', subs: { research: 'מחקר', creation: 'יצירה', planning: 'תכנון' } },
  health: { name: 'בריאות', subs: { water: 'מים', vitamins: 'ויטמינים', sport: 'ספורט', food: 'אוכל' } },
  bureaucracy: { name: 'בירוקרטיה', subs: null },
};

// ============================================
// STORAGE
// ============================================

const storage = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    } catch { return null; }
  },
  async set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { console.error('Storage set failed', e); }
  },
};

// ============================================
// HELPERS
// ============================================

function getDayKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function formatHebDate(date) {
  try {
    return new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' }).format(date);
  } catch { return date.toLocaleDateString(); }
}

function formatHebShort(date) {
  try {
    return new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'short' }).format(date);
  } catch { return date.toLocaleDateString(); }
}

function dayKeyFromString(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function urgencyRank(u) { return URGENCY_ORDER.indexOf(u); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function isWaterCategory(category) {
  if (!category) return false;
  return category.trim() === 'מים';
}

function isTaskComplete(task) {
  if (isWaterCategory(task.category)) {
    return (task.waterCups || 0) >= WATER_GOAL;
  }
  return !!task.completed;
}

function getDaysAgoKey(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return getDayKey(d);
}

function getCategoryColor(category) {
  if (!category) return CATEGORY_PALETTE[0];
  const trimmed = category.trim();
  if (KNOWN_CATEGORY_COLORS[trimmed]) return KNOWN_CATEGORY_COLORS[trimmed];
  let hash = 0;
  for (let i = 0; i < trimmed.length; i++) {
    hash = (hash * 31 + trimmed.charCodeAt(i)) % 1000003;
  }
  return CATEGORY_PALETTE[Math.abs(hash) % CATEGORY_PALETTE.length];
}

function firstLetter(str) {
  if (!str) return '?';
  return str.trim().charAt(0).toUpperCase();
}

function migrateTask(task) {
  if (task.category) return task;
  if (!task.area) return { ...task, category: 'כללי' };
  const legacy = LEGACY_AREAS[task.area];
  if (!legacy) return { ...task, category: 'כללי' };
  if (task.area === 'health' && task.sub === 'water') {
    return { ...task, category: 'מים' };
  }
  if (task.sub && legacy.subs && legacy.subs[task.sub]) {
    return { ...task, category: `${legacy.name} · ${legacy.subs[task.sub]}` };
  }
  return { ...task, category: legacy.name };
}

// ============================================
// MAIN APP
// ============================================

function App() {
  const [view, setView] = useState('today');
  const [tasks, setTasks] = useState([]);
  const [moments, setMoments] = useState([]);
  const [chains, setChains] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [todayKey, setTodayKey] = useState(getDayKey());

  useEffect(() => {
    if (!document.getElementById('hebrew-fonts')) {
      const link = document.createElement('link');
      link.id = 'hebrew-fonts';
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Heebo:wght@400;500;700&display=swap';
      document.head.appendChild(link);
    }
  }, []);

  useEffect(() => {
    (async () => {
      const t = (await storage.get('tasks')) || [];
      const m = (await storage.get('moments')) || [];
      const c = (await storage.get('chains')) || [];
      setTasks(t.map(migrateTask));
      setMoments(m);
      setChains(c);
      await storage.set('lastOpenDate', getDayKey());
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) storage.set('tasks', tasks); }, [tasks, loaded]);
  useEffect(() => { if (loaded) storage.set('moments', moments); }, [moments, loaded]);
  useEffect(() => { if (loaded) storage.set('chains', chains); }, [chains, loaded]);

  useEffect(() => {
    const interval = setInterval(() => {
      const newKey = getDayKey();
      if (newKey !== todayKey) setTodayKey(newKey);
    }, 60000);
    return () => clearInterval(interval);
  }, [todayKey]);

  // Helper: compute day key from a base key + offset
  const dayKeyAtOffset = useCallback((baseKey, offset) => {
    const d = dayKeyFromString(baseKey);
    d.setDate(d.getDate() + offset);
    return getDayKey(d);
  }, []);

  // Add a task. If the text matches an enabled chain trigger, also create the linked tasks.
  // If `newChain` is provided, persist it to the chains list (with the original task as the trigger).
  const addTask = useCallback((task, newChain = null) => {
    let chainTriggered = null;
    let groupId = null;

    // Check if this task triggers an existing chain (only if not creating a new chain right now)
    if (!newChain) {
      const triggerText = task.text.trim();
      chainTriggered = chains.find(
        (c) => c.enabled !== false && c.triggerText.trim() === triggerText
      );
    }

    if (newChain || chainTriggered) {
      groupId = uid();
    }

    const enrichedTask = {
      ...task,
      ...(groupId ? { chainGroupId: groupId } : {}),
      ...(chainTriggered ? { chainId: chainTriggered.id } : {}),
      ...(newChain ? { chainId: newChain.id || uid() } : {}),
    };

    const newTasks = [enrichedTask];
    const chainToUse = newChain || chainTriggered;

    if (chainToUse && chainToUse.links && chainToUse.links.length > 0) {
      for (const link of chainToUse.links) {
        const linkDayDate = dayKeyAtOffset(task.dayDate, link.dayOffset || 0);
        const linkTask = {
          id: uid(),
          text: link.text,
          category: link.category,
          urgency: 'm',
          completed: false,
          isBonus: false,
          dayDate: linkDayDate,
          createdAt: Date.now() + 1, // ensure stable ordering after parent
          completedAt: null,
          chainId: chainToUse.id || enrichedTask.chainId,
          chainGroupId: groupId,
          ...(isWaterCategory(link.category) ? { waterCups: 0 } : {}),
        };
        newTasks.push(linkTask);
      }
    }

    setTasks((prev) => [...prev, ...newTasks]);

    if (newChain) {
      // Persist the chain rule
      const chainToSave = {
        id: newChain.id || enrichedTask.chainId,
        triggerText: task.text.trim(),
        triggerCategory: task.category,
        links: newChain.links,
        enabled: true,
        createdAt: Date.now(),
      };
      setChains((prev) => {
        // If a chain with same triggerText exists, replace it
        const filtered = prev.filter((c) => c.triggerText.trim() !== chainToSave.triggerText);
        return [...filtered, chainToSave];
      });
    }
  }, [chains, dayKeyAtOffset]);
  const updateTask = useCallback(
    (id, updates) => setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, ...updates } : t))),
    []
  );
  const deleteTask = useCallback((id) => setTasks((prev) => prev.filter((t) => t.id !== id)), []);
  const moveTaskToTomorrow = useCallback((id) => {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    updateTask(id, { dayDate: getDayKey(tomorrow) });
  }, [updateTask]);
  const moveTaskToToday = useCallback((id) => updateTask(id, { dayDate: getDayKey() }), [updateTask]);

  const duplicateToTomorrow = useCallback((task) => {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const newTask = {
      ...task,
      id: uid(),
      dayDate: getDayKey(tomorrow),
      completed: false,
      isBonus: false,
      completedAt: null,
      createdAt: Date.now(),
    };
    if (isWaterCategory(task.category)) newTask.waterCups = 0;
    setTasks((prev) => [...prev, newTask]);
  }, []);

  const addMoment = useCallback((text) => {
    const m = { id: uid(), text, dayDate: getDayKey(), createdAt: Date.now() };
    setMoments((prev) => [...prev, m]);
  }, []);
  const deleteMoment = useCallback((id) => setMoments((prev) => prev.filter((m) => m.id !== id)), []);

  const resetAllData = useCallback(async () => {
    setTasks([]);
    setMoments([]);
    setChains([]);
    try {
      await storage.set('tasks', []);
      await storage.set('moments', []);
      await storage.set('chains', []);
    } catch (e) { console.error(e); }
  }, []);

  // Delete the whole chain group (all tasks created together) for a single trigger event
  const deleteChainGroup = useCallback((groupId) => {
    setTasks((prev) => prev.filter((t) => t.chainGroupId !== groupId));
  }, []);

  // Update a chain rule
  const updateChain = useCallback((id, updates) => {
    setChains((prev) => prev.map((c) => (c.id === id ? { ...c, ...updates } : c)));
  }, []);

  // Delete a chain rule (does not affect existing tasks)
  const deleteChain = useCallback((id) => {
    setChains((prev) => prev.filter((c) => c.id !== id));
  }, []);

  // Toggle a chain rule's enabled state
  const toggleChain = useCallback((id) => {
    setChains((prev) => prev.map((c) => (c.id === id ? { ...c, enabled: c.enabled === false ? true : false } : c)));
  }, []);

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: COLORS.bg, fontFamily: FONT }}>
        <div className="text-sm" style={{ color: COLORS.inkLight }}>✨</div>
      </div>
    );
  }

  return (
    <div dir="rtl" className="min-h-screen" style={{ background: COLORS.bg, fontFamily: FONT, color: COLORS.ink }}>
      <div className="max-w-md mx-auto px-5 pt-6" style={{ paddingBottom: view === 'today' ? '110px' : '32px' }}>
        {view === 'today' && (
          <TodayView
            tasks={tasks} chains={chains} todayKey={todayKey}
            onAdd={addTask} onUpdate={updateTask} onDelete={deleteTask}
            onMoveToTomorrow={moveTaskToTomorrow} onMoveToToday={moveTaskToToday}
            onDuplicateToTomorrow={duplicateToTomorrow}
            onDeleteChainGroup={deleteChainGroup}
            onOpenMoments={() => setView('moments')}
            onOpenDaily={() => setView('daily')}
            onOpenWeekly={() => setView('weekly')}
            onOpenChains={() => setView('chains')}
            onReset={resetAllData}
          />
        )}
        {view === 'moments' && (
          <MomentsView moments={moments} onAdd={addMoment} onDelete={deleteMoment} onBack={() => setView('today')} />
        )}
        {view === 'daily' && (
          <DailySummaryView tasks={tasks} moments={moments} todayKey={todayKey} onBack={() => setView('today')} />
        )}
        {view === 'weekly' && (
          <WeeklySummaryView tasks={tasks} moments={moments} todayKey={todayKey} onBack={() => setView('today')} />
        )}
        {view === 'chains' && (
          <ChainsView chains={chains} onUpdate={updateChain} onDelete={deleteChain} onToggle={toggleChain} onBack={() => setView('today')} />
        )}
      </div>
    </div>
  );
}

// ============================================
// TODAY VIEW
// ============================================

function TodayView({ tasks, chains, todayKey, onAdd, onUpdate, onDelete, onMoveToTomorrow, onMoveToToday, onDuplicateToTomorrow, onDeleteChainGroup, onOpenMoments, onOpenDaily, onOpenWeekly, onOpenChains, onReset }) {
  const [showAdd, setShowAdd] = useState(false);
  const [dayOffset, setDayOffset] = useState(0);
  const [confirmingReset, setConfirmingReset] = useState(false);

  const viewedDate = useMemo(() => {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    return d;
  }, [dayOffset]);
  const viewedDayKey = useMemo(() => getDayKey(viewedDate), [viewedDate]);
  const isViewingToday = dayOffset === 0;

  const dayLabel = useMemo(() => {
    if (dayOffset === 0) return 'היום';
    if (dayOffset === 1) return 'מחר';
    if (dayOffset === 2) return 'מחרתיים';
    if (dayOffset === -1) return 'אתמול';
    return formatHebShort(viewedDate);
  }, [dayOffset, viewedDate]);

  const dayTasks = useMemo(() => tasks.filter((t) => t.dayDate === viewedDayKey), [tasks, viewedDayKey]);

  // Pending tasks only relevant when viewing today
  const pendingTasks = useMemo(
    () => isViewingToday
      ? tasks.filter((t) => t.dayDate < todayKey && !isTaskComplete(t))
        .sort((a, b) => {
          if (a.dayDate !== b.dayDate) return a.dayDate.localeCompare(b.dayDate);
          return urgencyRank(a.urgency) - urgencyRank(b.urgency);
        })
      : [],
    [tasks, todayKey, isViewingToday]
  );

  const sortedTasks = useMemo(() => {
    return [...dayTasks].sort((a, b) => {
      const aComp = isTaskComplete(a);
      const bComp = isTaskComplete(b);
      if (aComp !== bComp) return aComp ? 1 : -1;
      const ru = urgencyRank(a.urgency) - urgencyRank(b.urgency);
      if (ru !== 0) return ru;
      return a.createdAt - b.createdAt;
    });
  }, [dayTasks]);

  const completedCount = dayTasks.filter(isTaskComplete).length;
  const totalCount = dayTasks.length;
  const progress = totalCount > 0 ? completedCount / totalCount : 0;
  const allDone = totalCount > 0 && completedCount === totalCount;

  // Future tasks count: tasks beyond the currently viewed day
  const futureCount = useMemo(
    () => tasks.filter((t) => t.dayDate > viewedDayKey).length,
    [tasks, viewedDayKey]
  );

  const goToToday = () => setDayOffset(0);
  const goPrevDay = () => setDayOffset((o) => Math.max(0, o - 1));
  const goNextDay = () => setDayOffset((o) => o + 1);

  return (
    <>
      {/* Header */}
      <div className="flex items-start justify-between mb-1">
        <div className="text-right flex-1 min-w-0">
          <div className="mb-1 flex items-center gap-1.5" style={{ color: COLORS.inkLight, fontSize: '11px', letterSpacing: '0.02em' }}>
            <span>{formatHebDate(viewedDate)}</span>
            {!isViewingToday && (
              <button onClick={goToToday}
                className="rounded-full px-2 py-0.5 transition-all active:scale-95 hover:opacity-80"
                style={{ background: COLORS.momentTint, color: COLORS.moment, fontSize: '10px', fontWeight: 700, letterSpacing: '0.04em' }}>
                ↺ חזרה להיום
              </button>
            )}
          </div>
          <div className="flex items-center gap-2">
            <h1 className="font-bold tracking-tight" style={{ color: COLORS.ink, fontSize: '28px', lineHeight: 1.1 }}>
              {dayLabel}
            </h1>
            <div className="flex items-center gap-0.5">
              {!isViewingToday && (
                <button onClick={goPrevDay}
                  className="rounded-full p-1 transition-all active:scale-90 hover:opacity-70"
                  style={{ background: 'transparent', color: COLORS.inkLight }}
                  aria-label="יום קודם">
                  <ChevronRight size={18} strokeWidth={2.2} />
                </button>
              )}
              <button onClick={goNextDay}
                className="rounded-full p-1 transition-all active:scale-90 hover:opacity-70"
                style={{ background: 'transparent', color: COLORS.inkLight }}
                aria-label="יום הבא">
                <ChevronLeft size={18} strokeWidth={2.2} />
              </button>
            </div>
          </div>
        </div>
        <div className="flex items-center gap-1.5">
          {chains && chains.length > 0 && onOpenChains && (
            <button onClick={onOpenChains}
              className="rounded-full p-2 transition-all active:scale-95 hover:opacity-80"
              style={{ background: 'white', border: `1px solid ${COLORS.border}` }}
              aria-label="שרשורים">
              <Link2 size={14} style={{ color: COLORS.inkSoft }} strokeWidth={2.2} />
            </button>
          )}
          <button onClick={onOpenMoments} className="rounded-full p-2.5 transition-all active:scale-95 hover:opacity-80"
            style={{ background: COLORS.momentTint }} aria-label="רגעים יפים">
            <Sparkles size={18} style={{ color: COLORS.moment }} />
          </button>
        </div>
      </div>

      {/* Progress / count */}
      {isViewingToday ? (
        <div className="mt-7 mb-7">
          <div className="flex items-center justify-between mb-1.5">
            <span style={{ color: allDone ? '#5A8B6F' : COLORS.inkLight, fontSize: '11px', fontWeight: 600, letterSpacing: '0.02em' }}>
              {totalCount === 0 ? 'אין משימות עדיין' : `${completedCount} מתוך ${totalCount}`}
            </span>
            <div className="flex items-center gap-2">
              {futureCount > 0 && (
                <button onClick={goNextDay}
                  className="transition-all hover:opacity-70 active:scale-95"
                  style={{ color: COLORS.inkLight, fontSize: '10.5px', fontWeight: 500 }}>
                  ✦ {futureCount} מתוכננות →
                </button>
              )}
              {allDone && (
                <span style={{ color: '#5A8B6F', fontSize: '11px', fontWeight: 600 }}>יום מלא ✓</span>
              )}
            </div>
          </div>
          <div className="rounded-full overflow-hidden" style={{ background: COLORS.borderSoft, height: '6px' }}>
            <div className="h-full rounded-full transition-all duration-700 ease-out"
              style={{ width: `${progress * 100}%`, background: allDone ? '#5A8B6F' : COLORS.ink }} />
          </div>
        </div>
      ) : (
        <div className="mt-5 mb-5 flex items-center justify-between">
          <span style={{ color: COLORS.inkSoft, fontSize: '12px', fontWeight: 500 }}>
            {totalCount === 0
              ? 'אין משימות מתוכננות'
              : `${totalCount} ${totalCount === 1 ? 'משימה מתוכננת' : 'משימות מתוכננות'}`}
          </span>
          {futureCount > 0 && (
            <span style={{ color: COLORS.inkLight, fontSize: '10.5px' }}>
              ✦ {futureCount} בהמשך
            </span>
          )}
        </div>

      {/* Add */}
      {showAdd ? (
        <AddTaskForm
          onAdd={(t, chain) => { onAdd(t, chain); setShowAdd(false); }}

      ) : (
        <button onClick={() => setShowAdd(true)}
          className="w-full mb-3 rounded-2xl py-3.5 px-5 flex items-center justify-center gap-2 transition-all active:scale-[0.99] hover:bg-white"

          <Plus size={15} strokeWidth={2.2} />
          <span style={{ fontSize: '13.5px', fontWeight: 500 }}>
            {isViewingToday ? 'משימה חדשה' : `משימה ל${dayLabel}`}
          </span>
        </button>
      )}

      {/* Pending tasks section (only on today) */}
      {isViewingToday && pendingTasks.length > 0 && (
        <PendingTasksSection pendingTasks={pendingTasks} onMoveToToday={onMoveToToday} onDelete={onDelete} />
      )}

      {sortedTasks.length === 0 && !showAdd && pendingTasks.length === 0 && (
        <div className="text-center py-10">
          <p style={{ color: COLORS.inkLight, fontSize: '13px' }}>
            {isViewingToday ? 'עוד אין משימות להיום' : `אין משימות מתוכננות ל${dayLabel}`}
          </p>
          <p className="mt-1" style={{ color: COLORS.inkVeryLight, fontSize: '11.5px' }}>
            {isViewingToday ? 'הקלף הראשון מתחיל כאן' : 'הוסיפי משימה כדי לתכנן'}

      {/* Today's tasks divider (only when both sections exist) */}
      {isViewingToday && sortedTasks.length > 0 && pendingTasks.length > 0 && (
        <div className="flex items-center gap-2 mt-5 mb-2.5" style={{ paddingRight: '4px' }}>

      {/* Reset (testing) - subtle at the bottom */}

              </span>
              <button onClick={() => {

                כן, מחקי

              <button onClick={() => setConfirmingReset(false)}

          ) : (
            <button onClick={() => setConfirmingReset(true)}
              className="transition-all hover:opacity-100 active:scale-95"
              style={{ color: COLORS.inkVeryLight, fontSize: '10.5px', fontWeight: 500, opacity: 0.7, letterSpacing: '0.04em' }}>

            </button>

        </div>

      {/* Bottom nav */}
      <div className="fixed bottom-0 left-0 right-0 pb-5 pt-6 pointer-events-none"
        style={{ background: `linear-gradient(to top, ${COLORS.bg} 60%, ${COLORS.bg}00)` }}>
        <div className="max-w-md mx-auto px-5 flex gap-2 pointer-events-auto">
          <button onClick={onOpenDaily}
            className="flex-1 rounded-2xl py-3 px-4 flex items-center justify-center gap-2 transition-all active:scale-[0.98] hover:shadow-sm"
            style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>

  );
}

// ============================================
// ADD TASK FORM
// ============================================

function AddTaskForm({ onAdd, onCancel, todayKey, defaultDayDate, allTasks, allChains }) {
  const [text, setText] = useState('');
  const [category, setCategory] = useState('');
  const [isBonus, setIsBonus] = useState(false);

  // Chain-related state
  const [chainLinks, setChainLinks] = useState([]); // [{text, category, dayOffset}]

  // Compute initial date mode based on defaultDayDate (which day the user is viewing)
  const tomorrowKey = useMemo(() => {
    const t = new Date();
    t.setDate(t.getDate() + 1);
    return getDayKey(t);
  }, []);

  const initialDateMode = useMemo(() => {
    const d = defaultDayDate || todayKey;
    if (d === todayKey) return 'today';
    if (d === tomorrowKey) return 'tomorrow';
    return 'custom';
  }, [defaultDayDate, todayKey, tomorrowKey]);

  const [dateMode, setDateMode] = useState(initialDateMode);
  const [customDate, setCustomDate] = useState(
    initialDateMode === 'custom' ? defaultDayDate : ''
  );
  const [activeField, setActiveField] = useState('text');
  const [showSuggestions, setShowSuggestions] = useState(true);
  const [highlightIdx, setHighlightIdx] = useState(-1);
  const textRef = useRef(null);
  const categoryRef = useRef(null);

  useEffect(() => { textRef.current?.focus(); }, []);

  const textSuggestions = useMemo(() => {
    const map = new Map();
    for (const t of allTasks) {
      const key = (t.text || '').trim();
      if (!key) continue;
      const ex = map.get(key);
      if (ex) {
        ex.count++;
        if (t.createdAt > ex.lastUsed) { ex.lastUsed = t.createdAt; ex.category = t.category; }
      } else {
        map.set(key, { count: 1, lastUsed: t.createdAt, category: t.category, text: key });
      }
    }
    const all = Array.from(map.values());
    const q = text.trim().toLowerCase();
    if (!q) return all.sort((a, b) => b.count - a.count || b.lastUsed - a.lastUsed).slice(0, 4);
    const matches = all.filter((s) => s.text.toLowerCase().includes(q));
    matches.sort((a, b) => {
      const aPre = a.text.toLowerCase().startsWith(q);
      const bPre = b.text.toLowerCase().startsWith(q);
      if (aPre !== bPre) return aPre ? -1 : 1;
      if (b.count !== a.count) return b.count - a.count;
      return b.lastUsed - a.lastUsed;
    });
    return matches.filter((m) => m.text.toLowerCase() !== q).slice(0, 5);
  }, [text, allTasks]);

  const categorySuggestions = useMemo(() => {
    const map = new Map();
    for (const t of allTasks) {
      const key = (t.category || '').trim();
      if (!key) continue;
      const ex = map.get(key);
      if (ex) { ex.count++; if (t.createdAt > ex.lastUsed) ex.lastUsed = t.createdAt; }
      else { map.set(key, { count: 1, lastUsed: t.createdAt, text: key }); }
    }
    const all = Array.from(map.values());
    const q = category.trim().toLowerCase();
    if (!q) return all.sort((a, b) => b.count - a.count || b.lastUsed - a.lastUsed).slice(0, 6);
    const matches = all.filter((s) => s.text.toLowerCase().includes(q));
    matches.sort((a, b) => {
      const aPre = a.text.toLowerCase().startsWith(q);
      const bPre = b.text.toLowerCase().startsWith(q);
      if (aPre !== bPre) return aPre ? -1 : 1;
      if (b.count !== a.count) return b.count - a.count;
      return b.lastUsed - a.lastUsed;
    });
    return matches.filter((m) => m.text.toLowerCase() !== q).slice(0, 6);
  }, [category, allTasks]);

  useEffect(() => { setHighlightIdx(-1); }, [text, category, activeField]);

  const pickTextSuggestion = (s) => {
    setText(s.text);
    if (s.category && !category) setCategory(s.category);
    setShowSuggestions(false);
    setTimeout(() => {
      if (!category && !s.category) categoryRef.current?.focus();
      else textRef.current?.focus();
    }, 0);
  };

  const pickCategorySuggestion = (s) => {
    setCategory(s.text);
    setShowSuggestions(false);
    setTimeout(() => categoryRef.current?.focus(), 0);
  };

  const computeDayDate = () => {
    if (dateMode === 'today') return todayKey;
    if (dateMode === 'tomorrow') {
      const t = new Date();
      t.setDate(t.getDate() + 1);
      return getDayKey(t);
    }
    return customDate || todayKey;
  };

  const submit = () => {
    if (!text.trim() || !category.trim()) return;
    const cleanCategory = category.trim();
    const isWater = isWaterCategory(cleanCategory);
    const dayDate = computeDayDate();
    const isPastOrToday = dayDate <= todayKey;
    const task = {
      id: uid(),
      category: cleanCategory,
      text: text.trim(),
      urgency: 'm',
      completed: isBonus && isPastOrToday,
      isBonus: isBonus && isPastOrToday,
      dayDate,
      createdAt: Date.now(),
      completedAt: isBonus && isPastOrToday ? Date.now() : null,
      ...(isWater ? { waterCups: isBonus && isPastOrToday ? WATER_GOAL : 0 } : {}),
    };

    // If user added new chain links, build a chain rule
    const validLinks = chainLinks.filter((l) => l.text.trim() && l.category.trim());
    if (validLinks.length > 0) {
      const newChain = {
        id: uid(),
        links: validLinks.map((l) => ({
          text: l.text.trim(),
          category: l.category.trim(),
          dayOffset: l.dayOffset || 0,
        })),
      };
      onAdd(task, newChain);
    } else {
      onAdd(task);
    }
  };

  // Detect if this text already triggers an existing chain
  const matchedChain = useMemo(() => {
    if (!text.trim() || !allChains) return null;
    return allChains.find(
      (c) => c.enabled !== false && c.triggerText.trim() === text.trim() && (chainLinks.length === 0)
    );
  }, [text, allChains, chainLinks.length]);

  const addChainLink = () => {
    setChainLinks((prev) => [...prev, { text: '', category: '', dayOffset: 1 }]);
  };
  const updateChainLink = (idx, updates) => {
    setChainLinks((prev) => prev.map((l, i) => (i === idx ? { ...l, ...updates } : l)));
  };
  const removeChainLink = (idx) => {
    setChainLinks((prev) => prev.filter((_, i) => i !== idx));
  };

  const canSubmit = text.trim() && category.trim();
  const tomorrowLabel = useMemo(() => {
    const t = new Date(); t.setDate(t.getDate() + 1);
    return formatHebShort(t);
  }, []);
  const minCustomDate = todayKey;
  const currentCatColor = category.trim() ? getCategoryColor(category.trim()) : null;

  const handleKeyDown = (e, field) => {
    const sugs = field === 'text' ? textSuggestions : categorySuggestions;
    if (e.key === 'ArrowDown' && sugs.length > 0) {
      e.preventDefault(); setHighlightIdx((i) => Math.min(i + 1, sugs.length - 1));
    } else if (e.key === 'ArrowUp' && sugs.length > 0) {
      e.preventDefault(); setHighlightIdx((i) => Math.max(i - 1, -1));
    } else if (e.key === 'Enter') {
      if (highlightIdx >= 0 && sugs[highlightIdx]) {
        if (field === 'text') pickTextSuggestion(sugs[highlightIdx]);
        else pickCategorySuggestion(sugs[highlightIdx]);
      } else if (field === 'text' && text.trim() && !category.trim()) {
        e.preventDefault(); categoryRef.current?.focus();
      } else { submit(); }
    } else if (e.key === 'Escape') {
      if (showSuggestions && sugs.length > 0) setShowSuggestions(false);
      else onCancel();
    }
  };

  return (
    <div className="rounded-2xl p-4 mb-3 relative"
      style={{ background: 'white', border: `1px solid ${COLORS.border}`, boxShadow: '0 4px 16px rgba(0,0,0,0.04)' }}>
      {/* Task name */}
      <div className="relative">
        <input ref={textRef} type="text" value={text}
          onChange={(e) => { setText(e.target.value); setShowSuggestions(true); }}
          onFocus={() => { setActiveField('text'); setShowSuggestions(true); }}
          onKeyDown={(e) => handleKeyDown(e, 'text')}
          placeholder="מה רוצים להוסיף?"
          className="w-full outline-none bg-transparent py-1.5 px-1"
          style={{ color: COLORS.ink, borderBottom: `1.5px solid ${COLORS.border}`,
            fontSize: '15.5px', fontFamily: FONT, fontWeight: 500 }} />

        {activeField === 'text' && showSuggestions && textSuggestions.length > 0 && (
          <div className="absolute left-0 right-0 mt-1.5 rounded-xl overflow-hidden z-20"
            style={{ background: 'white', border: `1px solid ${COLORS.border}`, boxShadow: '0 8px 24px rgba(0,0,0,0.08)' }}>
            {!text.trim() && (
              <div className="px-3 pt-2.5 pb-1"
                style={{ color: COLORS.inkLight, fontSize: '10px', fontWeight: 700, letterSpacing: '0.04em' }}>
                שימושים תכופים
              </div>
            )}
            {textSuggestions.map((s, i) => {
              const cat = getCategoryColor(s.category);
              const isWater = isWaterCategory(s.category);
              return (
                <button key={s.text}
                  onMouseDown={(e) => e.preventDefault()}
                  onClick={() => pickTextSuggestion(s)}
                  onMouseEnter={() => setHighlightIdx(i)}
                  className="w-full text-right px-3 py-2.5 flex items-center gap-2.5 transition-all"
                  style={{ background: highlightIdx === i ? COLORS.bg : 'transparent',
                    borderTop: i > 0 ? `1px solid ${COLORS.borderSoft}` : 'none' }}>
                  <div className="rounded-full flex items-center justify-center flex-shrink-0"
                    style={{ background: cat.tint, width: '22px', height: '22px',
                      color: cat.color, fontSize: '11px', fontWeight: 700 }}>
                    {isWater ? <Droplet size={10} fill={cat.color} strokeWidth={0} /> : firstLetter(s.category)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="truncate" style={{ color: COLORS.ink, fontSize: '13.5px', fontWeight: 500 }}>
                      {s.text}
                    </div>
                    <div style={{ color: COLORS.inkLight, fontSize: '10.5px' }}>{s.category}</div>
                  </div>
                  {s.count > 1 && (
                    <span className="rounded-full px-1.5 flex-shrink-0"
                      style={{ background: COLORS.borderSoft, color: COLORS.inkSoft,
                        fontSize: '10px', fontWeight: 700, height: '16px', lineHeight: '16px' }}>
                      ×{s.count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        )}
      </div>

      {/* Date pills */}
      <div className="flex items-center gap-1.5 mt-3.5">
        <Clock size={11} style={{ color: COLORS.inkLight }} />
        <button onClick={() => setDateMode('today')}
          className="px-2.5 py-1 rounded-full transition-all"
          style={{ background: dateMode === 'today' ? COLORS.ink : 'transparent',
            color: dateMode === 'today' ? 'white' : COLORS.inkSoft,
            border: `1px solid ${dateMode === 'today' ? COLORS.ink : COLORS.border}`,
            fontWeight: dateMode === 'today' ? 600 : 500, fontSize: '11.5px' }}>
          היום
        </button>
        <button onClick={() => setDateMode('tomorrow')}
          className="px-2.5 py-1 rounded-full transition-all"
          style={{ background: dateMode === 'tomorrow' ? COLORS.ink : 'transparent',
            color: dateMode === 'tomorrow' ? 'white' : COLORS.inkSoft,
            border: `1px solid ${dateMode === 'tomorrow' ? COLORS.ink : COLORS.border}`,
            fontWeight: dateMode === 'tomorrow' ? 600 : 500, fontSize: '11.5px' }}>
          מחר
        </button>
        <label className="px-2.5 py-1 rounded-full transition-all cursor-pointer flex items-center gap-1"
          style={{ background: dateMode === 'custom' ? COLORS.ink : 'transparent',
            color: dateMode === 'custom' ? 'white' : COLORS.inkSoft,
            border: `1px solid ${dateMode === 'custom' ? COLORS.ink : COLORS.border}`,
            fontWeight: dateMode === 'custom' ? 600 : 500, fontSize: '11.5px' }}>
          <Calendar size={10} />
          <input type="date" min={minCustomDate} value={customDate}
            onChange={(e) => { setCustomDate(e.target.value); setDateMode('custom'); }}
            className="bg-transparent outline-none border-none"
            style={{ fontSize: '11.5px', color: 'inherit', width: customDate ? 'auto' : '60px', fontFamily: FONT }} />
        </label>
      </div>

      {/* Category */}
      <div className="relative mt-3.5">
        <div className="flex items-center gap-2">
          <div className="rounded-full flex items-center justify-center flex-shrink-0"
            style={{ background: currentCatColor ? currentCatColor.tint : COLORS.borderSoft,
              width: '24px', height: '24px',
              color: currentCatColor ? currentCatColor.color : COLORS.inkLight,
              fontSize: '11px', fontWeight: 700 }}>
            {category.trim() ? (
              isWaterCategory(category)
                ? <Droplet size={11} fill={currentCatColor.color} strokeWidth={0} />
                : firstLetter(category)
            ) : <Tag size={11} strokeWidth={2.2} />}
          </div>
          <input ref={categoryRef} type="text" value={category}
            onChange={(e) => { setCategory(e.target.value); setShowSuggestions(true); }}
            onFocus={() => { setActiveField('category'); setShowSuggestions(true); }}
            onKeyDown={(e) => handleKeyDown(e, 'category')}
            placeholder="קטגוריה - למשל ספורט, כביסה, מים..."
            className="flex-1 outline-none bg-transparent py-1 px-1"
            style={{ color: COLORS.ink, borderBottom: `1px solid ${COLORS.borderSoft}`,
              fontSize: '13.5px', fontFamily: FONT, fontWeight: 500 }} />
        </div>

        {activeField === 'category' && showSuggestions && categorySuggestions.length > 0 && (
          <div className="absolute left-0 right-0 mt-1.5 rounded-xl overflow-hidden z-20"
            style={{ background: 'white', border: `1px solid ${COLORS.border}`, boxShadow: '0 8px 24px rgba(0,0,0,0.08)' }}>
            {!category.trim() && (
              <div className="px-3 pt-2.5 pb-1"
                style={{ color: COLORS.inkLight, fontSize: '10px', fontWeight: 700, letterSpacing: '0.04em' }}>
                קטגוריות שלך
              </div>
            )}
            {categorySuggestions.map((s, i) => {
              const cat = getCategoryColor(s.text);
              const isWater = isWaterCategory(s.text);
              return (
                <button key={s.text}
                  onMouseDown={(e) => e.preventDefault()}
                  onClick={() => pickCategorySuggestion(s)}
                  onMouseEnter={() => setHighlightIdx(i)}
                  className="w-full text-right px-3 py-2.5 flex items-center gap-2.5 transition-all"
                  style={{ background: highlightIdx === i ? COLORS.bg : 'transparent',
                    borderTop: i > 0 ? `1px solid ${COLORS.borderSoft}` : 'none' }}>
                  <div className="rounded-full flex items-center justify-center flex-shrink-0"
                    style={{ background: cat.tint, width: '22px', height: '22px',
                      color: cat.color, fontSize: '11px', fontWeight: 700 }}>
                    {isWater ? <Droplet size={10} fill={cat.color} strokeWidth={0} /> : firstLetter(s.text)}
                  </div>
                  <div className="flex-1 min-w-0 text-right">
                    <div className="truncate" style={{ color: COLORS.ink, fontSize: '13.5px', fontWeight: 500 }}>
                      {s.text}
                    </div>
                  </div>
                  {s.count > 1 && (
                    <span className="rounded-full px-1.5 flex-shrink-0"
                      style={{ background: COLORS.borderSoft, color: COLORS.inkSoft,
                        fontSize: '10px', fontWeight: 700, height: '16px', lineHeight: '16px' }}>
                      ×{s.count}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        )}
      </div>

      {/* Chain - matched existing chain notification */}
      {matchedChain && (
        <div className="mt-3 rounded-xl px-3 py-2 flex items-start gap-2"
          style={{ background: '#F5EBE3', border: `1px solid #E8D5C7` }}>
          <Link2 size={12} style={{ color: '#8B5A3C', marginTop: '2px' }} strokeWidth={2.5} />
          <div className="flex-1 min-w-0">
            <div style={{ color: '#8B5A3C', fontSize: '11px', fontWeight: 700, letterSpacing: '0.02em' }}>
              שרשור פעיל
            </div>
            <div className="mt-0.5" style={{ color: COLORS.inkSoft, fontSize: '11.5px', lineHeight: 1.4 }}>
              {matchedChain.links.map((l, i) => {
                const offsetLabel = l.dayOffset === 0 ? 'אותו יום' : l.dayOffset === 1 ? 'מחר' : `+${l.dayOffset} ימים`;
                return (
                  <div key={i}>
                    ← {l.text} <span style={{ color: COLORS.inkLight }}>({offsetLabel})</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Chain - existing links being added */}
      {chainLinks.length > 0 && (
        <div className="mt-3.5 rounded-xl p-3" style={{ background: COLORS.borderSoft }}>
          <div className="flex items-center gap-1.5 mb-2.5">
            <Link2 size={12} style={{ color: COLORS.inkSoft }} strokeWidth={2.5} />
            <span style={{ color: COLORS.inkSoft, fontSize: '10.5px', fontWeight: 700, letterSpacing: '0.04em' }}>
              שרשרת פעולות
            </span>
          </div>
          <div className="space-y-2">
            {chainLinks.map((link, idx) => (
              <ChainLinkInput
                key={idx}
                link={link}
                onChange={(updates) => updateChainLink(idx, updates)}
                onRemove={() => removeChainLink(idx)}
                allTasks={allTasks}
              />
            ))}
          </div>
          <button onClick={addChainLink}
            className="w-full mt-2 rounded-lg py-1.5 flex items-center justify-center gap-1 transition-all hover:opacity-80 active:scale-95"
            style={{ background: 'white', color: COLORS.inkSoft, fontSize: '11px', fontWeight: 600,
              border: `1px dashed ${COLORS.border}` }}>
            <Plus size={11} strokeWidth={2.5} />עוד פעולה
          </button>
        </div>
      )}

      {/* Add chain button - shown when text + category but no links yet */}
      {chainLinks.length === 0 && !matchedChain && text.trim() && category.trim() && (
        <button onClick={addChainLink}
          className="mt-3 transition-all hover:opacity-80 active:scale-95 flex items-center gap-1.5"
          style={{ color: COLORS.inkLight, fontSize: '11px', fontWeight: 500 }}>
          <Link2 size={11} strokeWidth={2.2} />
          <span>+ שרשר משימה נוספת</span>
        </button>
      )}

      {/* Footer */}
      <div className="flex items-center justify-between mt-4">
        {dateMode === 'today' ? (
          <label className="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" checked={isBonus} onChange={(e) => setIsBonus(e.target.checked)} className="sr-only" />
            <div className="rounded flex items-center justify-center transition-all"
              style={{ width: '16px', height: '16px',
                background: isBonus ? COLORS.moment : 'transparent',
                border: `1.5px solid ${isBonus ? COLORS.moment : COLORS.border}` }}>
              {isBonus && <Check size={10} strokeWidth={3.5} color="white" />}
            </div>
            <span style={{ color: isBonus ? COLORS.moment : COLORS.inkSoft,
              fontSize: '12px', fontWeight: isBonus ? 600 : 500 }}>
              ✦ כבר עשיתי (בונוס)
            </span>
          </label>
        ) : (
          <span style={{ color: COLORS.inkLight, fontSize: '11.5px' }}>
            {dateMode === 'tomorrow' ? `נשמר ל${tomorrowLabel}` : 'משימה עתידית'}
          </span>
        )}

        <div className="flex items-center gap-1.5">
          <button onClick={onCancel} className="p-2 rounded-lg transition-all hover:opacity-70"
            style={{ color: COLORS.inkLight }} aria-label="ביטול">
            <X size={16} />
          </button>
          <button onClick={submit} disabled={!canSubmit}
            className="p-2 rounded-lg transition-all"
            style={{ background: canSubmit ? COLORS.ink : COLORS.borderSoft,
              color: canSubmit ? 'white' : COLORS.inkLight, opacity: canSubmit ? 1 : 0.6 }}
            aria-label="שמירה">
            <Check size={16} strokeWidth={3} />
          </button>
        </div>
      </div>

      {!category.trim() && text.trim() && (
        <div className="mt-2 text-center" style={{ color: COLORS.inkLight, fontSize: '11px' }}>
          בחרי או כתבי קטגוריה כדי לסיים
        </div>
      )}
    </div>
  );
}

// ============================================
// TASK CARD
// ============================================

function TaskCard({ task, onUpdate, onDelete, onMoveToTomorrow, onDuplicateToTomorrow, onDeleteChainGroup }) {
  const [showUrgencyControls, setShowUrgencyControls] = useState(false);
  const [isEditing, setIsEditing] = useState(false);
  const [editText, setEditText] = useState(task.text);
  const [deleteState, setDeleteState] = useState('idle'); // idle | confirming
  const editInputRef = useRef(null);
  const cat = getCategoryColor(task.category);
  const isWater = isWaterCategory(task.category);
  const isComplete = isTaskComplete(task);
  const inChain = !!task.chainGroupId;

  useEffect(() => {
    if (isEditing) {
      editInputRef.current?.focus();
      editInputRef.current?.select();
    }
  }, [isEditing]);

  useEffect(() => { setEditText(task.text); }, [task.text]);

  const saveEdit = () => {
    const trimmed = editText.trim();
    if (trimmed && trimmed !== task.text) onUpdate(task.id, { text: trimmed });
    else setEditText(task.text);
    setIsEditing(false);
  };
  const cancelEdit = () => { setEditText(task.text); setIsEditing(false); };
  const cycleUrgency = (delta) => {
    const idx = urgencyRank(task.urgency);
    const newIdx = Math.max(0, Math.min(URGENCY_ORDER.length - 1, idx - delta));
    onUpdate(task.id, { urgency: URGENCY_ORDER[newIdx] });
  };
  const toggleComplete = () => {
    const newCompleted = !task.completed;
    onUpdate(task.id, { completed: newCompleted, completedAt: newCompleted ? Date.now() : null });
  };

  return (
    <div className="rounded-2xl px-4 py-3 transition-all"
      style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>
      <div className="flex items-center gap-3">
        {/* Text */}
        <div className="flex-1 min-w-0">
          <div className="leading-snug flex items-center gap-1.5 flex-wrap"
            style={{ textDecoration: isComplete && !isEditing ? 'line-through' : 'none',
              color: isComplete && !isEditing ? COLORS.inkLight : COLORS.ink,
              fontWeight: 500, fontSize: '13.5px' }}>
            {isEditing ? (
              <input ref={editInputRef} type="text" value={editText}
                onChange={(e) => setEditText(e.target.value)}
                onBlur={saveEdit}
                onKeyDown={(e) => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') cancelEdit(); }}
                className="flex-1 outline-none bg-transparent"
                style={{ color: COLORS.ink, borderBottom: `1.5px solid ${cat.color}`,
                  fontSize: '13.5px', fontFamily: FONT, fontWeight: 500,
                  padding: '0 0 2px 0', minWidth: 0 }} />
            ) : (
              <span onClick={() => setIsEditing(true)} className="cursor-text" style={{ wordBreak: 'break-word' }}>
                {task.text}
              </span>
            )}
            {task.isBonus && !isEditing && (
              <span className="px-1.5 rounded inline-flex items-center"
                style={{ background: COLORS.momentTint, color: COLORS.moment,
                  fontSize: '9.5px', fontWeight: 700, height: '15px', letterSpacing: '0.03em' }}>
                ✦ בונוס
              </span>
            )}
          </div>
          <div className="mt-0.5 flex items-center gap-1"
            style={{ fontSize: '10.5px', opacity: isComplete ? 0.7 : 1 }}>
            {isWater && <Droplet size={9} fill={cat.color} strokeWidth={0} />}
            <span style={{ color: cat.color, fontWeight: 600 }}>{task.category}</span>
            {inChain && (
              <Link2 size={9} style={{ color: COLORS.inkLight }} strokeWidth={2.5} aria-label="חלק משרשור" />
            )}
          </div>
        </div>

        {/* Urgency */}
        {!isWater && !task.isBonus && (
          <div className="flex items-center gap-1 flex-shrink-0">
            {showUrgencyControls && (
              <button onClick={() => cycleUrgency(-1)}
                className="rounded transition-all active:scale-90"
                style={{ background: COLORS.borderSoft, color: COLORS.inkSoft,
                  width: '20px', height: '20px', fontSize: '13px', fontWeight: 700, lineHeight: 1 }}>
                −
              </button>
            )}
            <button onClick={() => setShowUrgencyControls((v) => !v)}
              className="rounded transition-all"
              style={{ background: URGENCY_COLORS[task.urgency], color: 'white',
                fontSize: '9.5px', fontWeight: 700, minWidth: '28px', height: '20px',
                opacity: isComplete ? 0.4 : 1, letterSpacing: '0.04em' }}>
              {URGENCY_LABELS[task.urgency]}
            </button>
            {showUrgencyControls && (
              <button onClick={() => cycleUrgency(1)}
                className="rounded transition-all active:scale-90"
                style={{ background: COLORS.borderSoft, color: COLORS.inkSoft,
                  width: '20px', height: '20px', fontSize: '13px', fontWeight: 700, lineHeight: 1 }}>
                +
              </button>
            )}
          </div>
        )}

        {/* Water counter */}
        {isWater && (
          <div className="flex items-center gap-1 flex-shrink-0">
            <button onClick={() => {
                const cups = task.waterCups || 0;
                if (cups <= 0) return;
                onUpdate(task.id, { waterCups: cups - 1, completedAt: null });
              }}
              disabled={(task.waterCups || 0) === 0}
              className="rounded transition-all active:scale-90"
              style={{ background: COLORS.borderSoft, color: COLORS.inkSoft,
                width: '22px', height: '22px', fontSize: '14px', fontWeight: 700, lineHeight: 1,
                opacity: (task.waterCups || 0) === 0 ? 0.35 : 1 }}>
              −
            </button>
            <div className="rounded flex items-center gap-1 px-2"
              style={{ background: isComplete ? cat.color
                  : (task.waterCups || 0) > 0 ? cat.tint : COLORS.borderSoft,
                color: isComplete ? 'white'
                  : (task.waterCups || 0) > 0 ? cat.color : COLORS.inkLight,
                height: '22px', minWidth: '52px', justifyContent: 'center' }}>
              <Droplet size={10} fill="currentColor" strokeWidth={0} />
              <span style={{ fontSize: '11.5px', fontWeight: 700, letterSpacing: '0.02em' }}>
                {task.waterCups || 0}/{WATER_GOAL}
              </span>
            </div>
            <button onClick={() => {
                const cups = task.waterCups || 0;
                const newCups = Math.min(cups + 1, WATER_GOAL);
                onUpdate(task.id, { waterCups: newCups, completedAt: newCups >= WATER_GOAL ? Date.now() : null });
              }}
              disabled={(task.waterCups || 0) >= WATER_GOAL}
              className="rounded transition-all active:scale-90"
              style={{ background: (task.waterCups || 0) >= WATER_GOAL ? COLORS.borderSoft : cat.color,
                color: (task.waterCups || 0) >= WATER_GOAL ? COLORS.inkLight : 'white',
                width: '22px', height: '22px', fontSize: '14px', fontWeight: 700, lineHeight: 1,
                opacity: (task.waterCups || 0) >= WATER_GOAL ? 0.35 : 1 }}>
              +
            </button>
          </div>
        )}

        {/* Checkbox */}
        {!isWater && (
          <button onClick={toggleComplete}
            className="rounded-full flex items-center justify-center flex-shrink-0 transition-all active:scale-90"
            style={{ width: '22px', height: '22px',
              background: isComplete ? COLORS.ink : 'transparent',
              border: `1.5px solid ${isComplete ? COLORS.ink : COLORS.border}` }}
            aria-label={isComplete ? 'בטל סימון' : 'סמן כהושלם'}>
            {isComplete && <Check size={11} strokeWidth={3.5} color="white" />}
          </button>
        )}
      </div>

      {/* Footer actions - always full opacity, clearly enabled */}
      <div className="flex items-center gap-3.5 mt-2.5 flex-wrap">
        {!isComplete && (
          <button onClick={() => onMoveToTomorrow(task.id)}
            className="flex items-center gap-1 transition-all hover:opacity-100 active:scale-95"
            style={{ color: COLORS.inkSoft, fontSize: '11px', fontWeight: 500, opacity: 1 }}>
            <ArrowLeft size={11} /><span>דחה למחר</span>
          </button>
        )}
        <button onClick={() => onDuplicateToTomorrow(task)}
          className="flex items-center gap-1 transition-all hover:opacity-100 active:scale-95"
          style={{ color: COLORS.ink, fontSize: '11px', fontWeight: 600, opacity: 1 }}>
          <CopyPlus size={11} strokeWidth={2.2} /><span>שכפל למחר</span>
        </button>
        {!isEditing && (
          <button onClick={() => setIsEditing(true)}
            className="flex items-center gap-1 transition-all hover:opacity-100 active:scale-95"
            style={{ color: COLORS.inkSoft, fontSize: '11px', fontWeight: 500, opacity: 1 }}
            aria-label="עריכה">
            <Pencil size={11} /><span>ערוך</span>
          </button>
        )}
        {deleteState === 'idle' ? (
          <button onClick={() => setDeleteState('confirming')}
            className="flex items-center transition-all hover:opacity-100 active:scale-95 mr-auto"
            style={{ color: COLORS.inkLight, opacity: 0.7 }}
            aria-label="מחק">
            <Trash2 size={11} />
          </button>
        ) : (
          <div className="flex items-center gap-1.5 mr-auto">
            <button onClick={() => { onDelete(task.id); setDeleteState('idle'); }}
              className="rounded-full px-2 py-0.5 transition-all active:scale-95"
              style={{ background: COLORS.cnf, color: 'white', fontSize: '10px', fontWeight: 700 }}>
              {inChain ? 'רק זו' : 'מחק'}
            </button>
            {inChain && onDeleteChainGroup && (
              <button onClick={() => { onDeleteChainGroup(task.chainGroupId); setDeleteState('idle'); }}
                className="rounded-full px-2 py-0.5 transition-all active:scale-95 flex items-center gap-1"
                style={{ background: COLORS.cnf, color: 'white', fontSize: '10px', fontWeight: 700 }}>
                <Link2 size={9} strokeWidth={2.5} />כל השרשור
              </button>
            )}
            <button onClick={() => setDeleteState('idle')}
              className="rounded-full px-2 py-0.5 transition-all active:scale-95"
              style={{ background: COLORS.borderSoft, color: COLORS.inkSoft, fontSize: '10px', fontWeight: 600 }}>
              ביטול
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================
// CHAINS VIEW
// ============================================

function ChainsView({ chains, onUpdate, onDelete, onToggle, onBack }) {
  const sortedChains = useMemo(
    () => [...chains].sort((a, b) => b.createdAt - a.createdAt),
    [chains]
  );

  const offsetLabel = (offset) => {
    if (offset === 0) return 'אותו יום';
    if (offset === 1) return 'מחר';
    if (offset === 2) return 'מחרתיים';
    return `+${offset} ימים`;
  };

  return (
    <>
      <div className="flex items-start justify-between mb-1">
        <div className="text-right">
          <div className="mb-0.5" style={{ color: COLORS.inkLight, fontSize: '11px' }}>
            כללי אוטומציה
          </div>
          <h1 className="font-bold tracking-tight" style={{ color: COLORS.ink, fontSize: '28px', lineHeight: 1.1 }}>
            השרשורים שלי
          </h1>
        </div>
        <button onClick={onBack}
          className="rounded-full p-2.5 transition-all active:scale-95 hover:opacity-80"
          style={{ background: 'white', border: `1px solid ${COLORS.border}` }}
          aria-label="חזרה">
          <ChevronRight size={16} style={{ color: COLORS.inkSoft }} />
        </button>
      </div>

      <p className="mt-3 mb-6" style={{ color: COLORS.inkLight, fontSize: '12px', lineHeight: 1.5 }}>
        כשתוסיפי משימה ששמה תואם לטריגר, יווצרו אוטומטית גם המשימות המשורשרות.
      </p>

      {sortedChains.length === 0 ? (
        <div className="text-center py-12">
          <Link2 size={28} className="mx-auto mb-3" style={{ color: COLORS.inkLight, opacity: 0.5 }} strokeWidth={1.5} />
          <p style={{ color: COLORS.inkLight, fontSize: '13px' }}>עוד אין שרשורים</p>
          <p className="mt-1" style={{ color: COLORS.inkVeryLight, fontSize: '11.5px' }}>
            צרי שרשור מתוך טופס משימה חדשה
          </p>
        </div>
      ) : (
        <div className="space-y-3">
          {sortedChains.map((chain) => {
            const triggerCat = getCategoryColor(chain.triggerCategory);
            const isDisabled = chain.enabled === false;
            return (
              <ChainCard key={chain.id} chain={chain} triggerCat={triggerCat} isDisabled={isDisabled}
                onUpdate={onUpdate} onDelete={onDelete} onToggle={onToggle} offsetLabel={offsetLabel} />
            );
          })}
        </div>
      )}
    </>
  );
}

function ChainCard({ chain, triggerCat, isDisabled, onUpdate, onDelete, onToggle, offsetLabel }) {
  const [confirming, setConfirming] = useState(false);
  return (
    <div className="rounded-2xl px-4 py-3.5 transition-all"
      style={{ background: 'white', border: `1px solid ${COLORS.border}`, opacity: isDisabled ? 0.6 : 1 }}>
      {/* Trigger */}
      <div className="flex items-center gap-2">
        <div className="rounded-full flex items-center justify-center flex-shrink-0"
          style={{ background: triggerCat.tint, width: '24px', height: '24px',
            color: triggerCat.color, fontSize: '11px', fontWeight: 700 }}>
          {isWaterCategory(chain.triggerCategory)
            ? <Droplet size={11} fill={triggerCat.color} strokeWidth={0} />
            : firstLetter(chain.triggerCategory)}
        </div>
        <div className="flex-1 min-w-0">
          <div style={{ color: COLORS.ink, fontSize: '13.5px', fontWeight: 600 }}>
            {chain.triggerText}
          </div>
          <div style={{ color: triggerCat.color, fontSize: '10.5px', fontWeight: 600 }}>
            {chain.triggerCategory}
          </div>
        </div>
      </div>

      {/* Links */}
      <div className="mt-3 mr-7 space-y-1.5">
        {chain.links.map((link, i) => {
          const linkCat = getCategoryColor(link.category);
          return (
            <div key={i} className="flex items-center gap-2">
              <Link2 size={10} style={{ color: COLORS.inkLight }} strokeWidth={2.5} />
              <div className="flex-1 min-w-0 flex items-center gap-1.5 flex-wrap">
                <span style={{ color: COLORS.inkSoft, fontSize: '12px', fontWeight: 500 }}>
                  {link.text}
                </span>
                <span style={{ color: linkCat.color, fontSize: '10px', fontWeight: 600 }}>
                  · {link.category}
                </span>
                <span className="rounded-full px-1.5"
                  style={{ background: COLORS.borderSoft, color: COLORS.inkLight,
                    fontSize: '9.5px', fontWeight: 600 }}>
                  {offsetLabel(link.dayOffset || 0)}
                </span>
              </div>
            </div>
          );
        })}
      </div>

      {/* Footer */}
      <div className="flex items-center gap-3 mt-3 pt-2.5"
        style={{ borderTop: `1px solid ${COLORS.borderSoft}` }}>
        <button onClick={() => onToggle(chain.id)}
          className="flex items-center gap-1 transition-all hover:opacity-80 active:scale-95"
          style={{ color: isDisabled ? COLORS.inkLight : '#5A8B6F', fontSize: '11px', fontWeight: 600 }}>
          {isDisabled ? '○ מבוטל' : '● פעיל'}
        </button>
        <div className="flex-1" />
        {confirming ? (
          <div className="flex items-center gap-1.5">
            <button onClick={() => { onDelete(chain.id); setConfirming(false); }}
              className="rounded-full px-2 py-0.5 transition-all active:scale-95"
              style={{ background: COLORS.cnf, color: 'white', fontSize: '10px', fontWeight: 700 }}>
              למחוק
            </button>
            <button onClick={() => setConfirming(false)}
              className="rounded-full px-2 py-0.5 transition-all active:scale-95"
              style={{ background: COLORS.borderSoft, color: COLORS.inkSoft, fontSize: '10px', fontWeight: 600 }}>
              ביטול
            </button>
          </div>
        ) : (
          <button onClick={() => setConfirming(true)}
            className="flex items-center gap-1 transition-all hover:opacity-100 active:scale-95"
            style={{ color: COLORS.inkLight, fontSize: '11px', opacity: 0.7 }}
            aria-label="מחק שרשור">
            <Trash2 size={11} />
          </button>
        )}
      </div>
    </div>
  );
}

// ============================================
// MOMENTS VIEW
// ============================================

function MomentsView({ moments, onAdd, onDelete, onBack }) {
  const [text, setText] = useState('');

  const grouped = useMemo(() => {
    const today = getDayKey();
    const yesterday = getDaysAgoKey(1);
    const groups = {};
    [...moments].sort((a, b) => b.createdAt - a.createdAt).forEach((m) => {
      let label;
      if (m.dayDate === today) label = 'היום';
      else if (m.dayDate === yesterday) label = 'אתמול';
      else label = formatHebShort(dayKeyFromString(m.dayDate));
      groups[label] = groups[label] || [];
      groups[label].push(m);
    });
    return groups;
  }, [moments]);

  const submit = () => { if (!text.trim()) return; onAdd(text.trim()); setText(''); };

  return (
    <>
      <div className="flex items-start justify-between mb-1">
        <div className="text-right">
          <div className="mb-0.5" style={{ color: COLORS.inkLight, fontSize: '11px' }}>
            {formatHebDate(new Date())}
          </div>
          <h1 className="font-bold tracking-tight flex items-center gap-2"
            style={{ color: COLORS.ink, fontSize: '26px', lineHeight: 1.1 }}>
            רגעים יפים <Sparkles size={20} style={{ color: COLORS.moment }} />
          </h1>
        </div>
        <button onClick={onBack}
          className="rounded-full p-2 transition-all active:scale-95 hover:opacity-70"
          style={{ color: COLORS.inkSoft }} aria-label="חזרה">
          <ChevronLeft size={20} style={{ transform: 'scaleX(-1)' }} />
        </button>
      </div>

      <div className="rounded-2xl p-4 mt-6 mb-7"
        style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>
        <textarea value={text} onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); }}
          placeholder="משהו טוב שקרה היום..." rows={2}
          className="w-full outline-none bg-transparent resize-none leading-relaxed"
          style={{ color: COLORS.ink, fontFamily: FONT, fontSize: '14px' }} />
        <div className="flex items-center justify-between mt-2">
          <span style={{ color: COLORS.inkVeryLight, fontSize: '10px' }}>
            ⌘ + Enter לשמירה מהירה
          </span>
          <button onClick={submit} disabled={!text.trim()}
            className="px-3.5 py-1.5 rounded-lg transition-all"
            style={{ background: text.trim() ? COLORS.moment : COLORS.borderSoft,
              color: text.trim() ? 'white' : COLORS.inkLight,
              fontWeight: 600, fontSize: '12px', opacity: text.trim() ? 1 : 0.7 }}>
            שמירה
          </button>
        </div>
      </div>

      {moments.length === 0 ? (
        <div className="text-center py-12">
          <Sparkles size={28} className="mx-auto mb-3" style={{ color: COLORS.moment, opacity: 0.4 }} />
          <p style={{ color: COLORS.inkLight, fontSize: '13px' }}>עדיין אין כאן רגעים</p>
          <p className="mt-1" style={{ color: COLORS.inkVeryLight, fontSize: '11.5px' }}>
            כל מה שכדאי לזכור — מתחיל מכאן
          </p>
        </div>
      ) : (
        <div className="space-y-5">
          {Object.entries(grouped).map(([label, items]) => (
            <div key={label}>
              <h3 className="mb-2"
                style={{ color: COLORS.inkLight, fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em' }}>
                {label.toUpperCase()}
              </h3>
              <div className="space-y-2">
                {items.map((m) => (
                  <div key={m.id} className="rounded-xl px-4 py-3 group flex items-start gap-2.5"
                    style={{ background: COLORS.momentTint }}>
                    <Sparkles size={11} className="flex-shrink-0"
                      style={{ color: COLORS.moment, marginTop: '4px' }} />
                    <p className="flex-1 leading-relaxed" style={{ color: COLORS.ink, fontSize: '13.5px' }}>
                      {m.text}
                    </p>
                    <button onClick={() => onDelete(m.id)}
                      className="opacity-0 group-hover:opacity-50 hover:opacity-100 transition-all"
                      aria-label="מחק">
                      <X size={12} style={{ color: COLORS.inkLight }} />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// ============================================
// DAILY SUMMARY
// ============================================

function DailySummaryView({ tasks, moments, todayKey, onBack }) {
  const todayTasks = tasks.filter((t) => t.dayDate === todayKey);
  const completed = todayTasks.filter(isTaskComplete);
  const planned = completed.filter((t) => !t.isBonus);
  const bonus = completed.filter((t) => t.isBonus);
  const todayMoments = moments.filter((m) => m.dayDate === todayKey);

  const byCategory = useMemo(() => {
    const groups = {};
    for (const t of completed) {
      const c = t.category || 'כללי';
      groups[c] = groups[c] || [];
      groups[c].push(t);
    }
    return Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  }, [completed]);

  const total = completed.length + todayMoments.length;

  return (
    <>
      <div className="flex items-start justify-between mb-1">
        <div className="text-right">
          <div className="mb-0.5" style={{ color: COLORS.inkLight, fontSize: '11px' }}>
            {formatHebDate(new Date())}
          </div>
          <h1 className="font-bold tracking-tight"
            style={{ color: COLORS.ink, fontSize: '26px', lineHeight: 1.1 }}>
            סיכום יומי
          </h1>
        </div>
        <button onClick={onBack}
          className="rounded-full p-2 transition-all active:scale-95 hover:opacity-70"
          style={{ color: COLORS.inkSoft }}>
          <ChevronLeft size={20} style={{ transform: 'scaleX(-1)' }} />
        </button>
      </div>

      {total === 0 && todayMoments.length === 0 ? (
        <div className="text-center py-16 mt-8">
          <p style={{ color: COLORS.inkSoft, fontSize: '15px', fontWeight: 500 }}>
            עוד לא הצטבר היום סיכום
          </p>
          <p className="mt-1.5" style={{ color: COLORS.inkLight, fontSize: '12.5px' }}>
            וזה גם בסדר. יום שלם עוד לפנייך.
          </p>
        </div>
      ) : (
        <div className="mt-7 space-y-5">
          <div className="rounded-2xl p-7 text-center"
            style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>
            <div style={{ color: COLORS.ink, fontSize: '52px', fontWeight: 800, lineHeight: 1, fontFamily: FONT }}>
              {total}
            </div>
            <div className="mt-2" style={{ color: COLORS.inkSoft, fontSize: '12.5px' }}>
              {total === 1 ? 'דבר טוב היום' : 'דברים טובים היום'}
            </div>
          </div>

          {(planned.length > 0 || bonus.length > 0) && (
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded-2xl p-4 text-center"
                style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>
                <div style={{ color: COLORS.ink, fontSize: '24px', fontWeight: 700 }}>
                  {planned.length}
                </div>
                <div className="mt-1" style={{ color: COLORS.inkSoft, fontSize: '11.5px' }}>תוכננו</div>
              </div>
              <div className="rounded-2xl p-4 text-center"
                style={{ background: COLORS.momentTint, border: `1px solid ${COLORS.momentTint}` }}>
                <div style={{ color: COLORS.moment, fontSize: '24px', fontWeight: 700 }}>
                  {bonus.length}
                </div>
                <div className="mt-1" style={{ color: COLORS.moment, fontSize: '11.5px' }}>✦ בונוס</div>
              </div>
            </div>
          )}

          {completed.length > 0 && (
            <div className="rounded-2xl p-4"
              style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>
              <h3 className="mb-3"
                style={{ color: COLORS.inkLight, fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em' }}>
                לפי קטגוריה
              </h3>
              <div className="space-y-2.5">
                {byCategory.map(([catName, items]) => {
                  const cat = getCategoryColor(catName);
                  const isWater = isWaterCategory(catName);
                  return (
                    <div key={catName}>
                      <div className="flex items-center gap-2 mb-1.5">
                        <div className="rounded-full flex items-center justify-center"
                          style={{ background: cat.tint, width: '22px', height: '22px',
                            color: cat.color, fontSize: '10.5px', fontWeight: 700 }}>
                          {isWater ? <Droplet size={10} fill={cat.color} strokeWidth={0} /> : firstLetter(catName)}
                        </div>
                        <span style={{ color: COLORS.ink, fontSize: '13px', fontWeight: 600 }}>
                          {catName}
                        </span>
                        <span className="mr-auto" style={{ color: COLORS.inkLight, fontSize: '11.5px' }}>
                          {items.length}
                        </span>
                      </div>
                      <ul className="space-y-1" style={{ paddingRight: '30px' }}>
                        {items.map((t) => (
                          <li key={t.id} style={{ color: COLORS.inkSoft, fontSize: '12.5px' }}>
                            • {t.text}
                            {t.isBonus && (
                              <span className="mr-1" style={{ color: COLORS.moment, fontSize: '10px' }}>✦</span>
                            )}
                          </li>
                        ))}
                      </ul>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {todayMoments.length > 0 && (
            <div className="rounded-2xl p-4" style={{ background: COLORS.momentTint }}>
              <h3 className="mb-3 flex items-center gap-1.5"
                style={{ color: COLORS.moment, fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em' }}>
                <Sparkles size={11} />רגעים יפים
              </h3>
              <ul className="space-y-2">
                {todayMoments.map((m) => (
                  <li key={m.id} style={{ color: COLORS.ink, fontSize: '13px', lineHeight: 1.5 }}>
                    {m.text}
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}
    </>
  );
}

// ============================================
// WEEKLY SUMMARY
// ============================================

function WeeklySummaryView({ tasks, moments, todayKey, onBack }) {
  const days = useMemo(() => {
    const list = [];
    for (let i = 6; i >= 0; i--) {
      const dKey = getDaysAgoKey(i);
      const d = dayKeyFromString(dKey);
      const dayTasks = tasks.filter((t) => t.dayDate === dKey);
      const completedCount = dayTasks.filter(isTaskComplete).length;
      const dayMoments = moments.filter((m) => m.dayDate === dKey);
      list.push({
        key: dKey, date: d, total: dayTasks.length, completed: completedCount,
        bonus: dayTasks.filter((t) => isTaskComplete(t) && t.isBonus).length,
        moments: dayMoments.length, isToday: dKey === todayKey,
      });
    }
    return list;
  }, [tasks, moments, todayKey]);

  const weekTasks = tasks.filter((t) => {
    const cutoff = getDaysAgoKey(6);
    return t.dayDate >= cutoff && isTaskComplete(t);
  });
  const weekMoments = moments.filter((m) => m.dayDate >= getDaysAgoKey(6));

  const byCategory = useMemo(() => {
    const groups = {};
    for (const t of weekTasks) {
      const c = t.category || 'כללי';
      groups[c] = (groups[c] || 0) + 1;
    }
    return Object.entries(groups).sort((a, b) => b[1] - a[1]);
  }, [weekTasks]);

  const totalCompleted = weekTasks.length;
  const totalBonus = weekTasks.filter((t) => t.isBonus).length;
  const maxDayDone = Math.max(...days.map((d) => d.completed), 1);

  let streak = 0;
  for (let i = days.length - 1; i >= 0; i--) {
    if (days[i].completed > 0 || days[i].moments > 0) streak++;
    else break;
  }

  return (
    <>
      <div className="flex items-start justify-between mb-1">
        <div className="text-right">
          <div className="mb-0.5" style={{ color: COLORS.inkLight, fontSize: '11px' }}>
            7 ימים אחרונים
          </div>
          <h1 className="font-bold tracking-tight"
            style={{ color: COLORS.ink, fontSize: '26px', lineHeight: 1.1 }}>
            סיכום שבועי
          </h1>
        </div>
        <button onClick={onBack}
          className="rounded-full p-2 transition-all active:scale-95 hover:opacity-70"
          style={{ color: COLORS.inkSoft }}>
          <ChevronLeft size={20} style={{ transform: 'scaleX(-1)' }} />
        </button>
      </div>

      {totalCompleted === 0 && weekMoments.length === 0 ? (
        <div className="text-center py-16 mt-8">
          <p style={{ color: COLORS.inkSoft, fontSize: '15px', fontWeight: 500 }}>
            השבוע עוד לא התחיל להצטבר
          </p>
          <p className="mt-1.5" style={{ color: COLORS.inkLight, fontSize: '12.5px' }}>
            כל קלף שתסמני ייכנס לכאן
          </p>
        </div>
      ) : (
        <div className="mt-7 space-y-5">
          <div className="grid grid-cols-3 gap-2">
            <StatCard label="סה״כ" value={totalCompleted} color={COLORS.ink} />
            <StatCard label="✦ בונוס" value={totalBonus} color={COLORS.moment} tint={COLORS.momentTint} />
            <StatCard label={<span className="inline-flex items-center gap-1"><Flame size={11} /> רצף</span>}
              value={streak} color={streak >= 3 ? COLORS.cnf : COLORS.ink} />
          </div>

          <div className="rounded-2xl p-4" style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>
            <h3 className="mb-3"
              style={{ color: COLORS.inkLight, fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em' }}>
              לפי יום
            </h3>
            <div className="flex items-end justify-between gap-2" style={{ height: '90px' }}>
              {days.map((d) => {
                const ratio = d.completed / maxDayDone;
                const dayName = new Intl.DateTimeFormat('he-IL', { weekday: 'short' }).format(d.date);
                return (
                  <div key={d.key}
                    className="flex flex-col items-center justify-end flex-1 gap-1.5"
                    style={{ height: '100%' }}>
                    <div style={{ color: d.isToday ? COLORS.ink : COLORS.inkLight, fontSize: '10.5px', fontWeight: 700 }}>
                      {d.completed || ''}
                    </div>
                    <div className="w-full rounded-md transition-all"
                      style={{ height: `${Math.max(ratio * 60, d.completed > 0 ? 6 : 2)}px`,
                        background: d.completed === 0 ? COLORS.borderSoft
                          : d.isToday ? COLORS.ink : COLORS.inkSoft,
                        opacity: d.isToday ? 1 : 0.85 }} />
                    <div style={{ color: d.isToday ? COLORS.ink : COLORS.inkLight,
                      fontSize: '10px', fontWeight: d.isToday ? 700 : 500 }}>
                      {dayName.replace('יום ', '')}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {byCategory.length > 0 && (
            <div className="rounded-2xl p-4" style={{ background: 'white', border: `1px solid ${COLORS.border}` }}>
              <h3 className="mb-3"
                style={{ color: COLORS.inkLight, fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em' }}>
                לפי קטגוריה
              </h3>
              <div className="space-y-2.5">
                {byCategory.map(([catName, count]) => {
                  const cat = getCategoryColor(catName);
                  const isWater = isWaterCategory(catName);
                  const ratio = totalCompleted > 0 ? count / totalCompleted : 0;
                  return (
                    <div key={catName} className="flex items-center gap-3">
                      <div className="rounded-full flex items-center justify-center flex-shrink-0"
                        style={{ background: cat.tint, width: '26px', height: '26px',
                          color: cat.color, fontSize: '12px', fontWeight: 700 }}>
                        {isWater ? <Droplet size={12} fill={cat.color} strokeWidth={0} /> : firstLetter(catName)}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between mb-1">
                          <span style={{ color: COLORS.ink, fontSize: '12.5px', fontWeight: 600 }}>
                            {catName}
                          </span>
                          <span style={{ color: COLORS.inkLight, fontSize: '11.5px' }}>
                            {count}
                          </span>
                        </div>
                        <div className="rounded-full overflow-hidden"
                          style={{ background: COLORS.borderSoft, height: '4px' }}>
                          <div className="h-full rounded-full transition-all"
                            style={{ width: `${ratio * 100}%`, background: cat.color }} />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {weekMoments.length > 0 && (
            <div className="rounded-2xl p-4 flex items-center gap-3" style={{ background: COLORS.momentTint }}>
              <div className="rounded-full flex items-center justify-center"
                style={{ background: 'white', width: '36px', height: '36px' }}>
                <Sparkles size={16} style={{ color: COLORS.moment }} />
              </div>
              <div className="flex-1">
                <div style={{ color: COLORS.ink, fontSize: '14px', fontWeight: 600 }}>
                  {weekMoments.length} {weekMoments.length === 1 ? 'רגע יפה' : 'רגעים יפים'} השבוע
                </div>
                <div className="mt-0.5" style={{ color: COLORS.moment, fontSize: '11.5px' }}>
                  כל אחד מהם — לא מובן מאליו
                </div>
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );
}

function StatCard({ label, value, color, tint }) {
  return (
    <div className="rounded-2xl p-3 text-center"
      style={{ background: tint || 'white',
        border: tint ? `1px solid ${tint}` : `1px solid ${COLORS.border}` }}>
      <div style={{ color: color || COLORS.ink, fontSize: '22px', fontWeight: 700, lineHeight: 1 }}>
        {value}
      </div>
      <div className="mt-1.5"
        style={{ color: color || COLORS.inkSoft, fontSize: '10.5px', fontWeight: 600 }}>
        {label}
      </div>
    </div>
  );
}
